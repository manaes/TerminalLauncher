name: Release

# v* 태그 푸시 시:
#   1) Release archive 빌드 (Developer ID 매뉴얼 서명, iCloud 제외 entitlements)
#   2) exportArchive(method=developer-id) 로 Sparkle 중첩 코드까지 재서명
#   3) notarytool 공증 + stapler 스테이플
#   4) Sparkle EdDSA 서명 + appcast.xml 생성
#   5) GitHub Releases 에 PathDock-<ver>.zip + appcast.xml 첨부
#
# 필요한 시크릿:
#   APPLE_CERTIFICATE            Developer ID Application 인증서(.p12) base64
#   APPLE_CERTIFICATE_PASSWORD   .p12 비밀번호
#   APPLE_SIGNING_IDENTITY       예: "Developer ID Application: Juwan Park (XXXXXXXXXX)"
#   APPLE_ID                     Apple 계정 이메일
#   APPLE_PASSWORD               앱 암호(app-specific password: xxxx-xxxx-xxxx-xxxx)
#   APPLE_TEAM_ID                Developer ID 인증서의 팀 ID
#   SPARKLE_ED_PRIVATE_KEY       Sparkle EdDSA 개인키(generate_keys -x 로 내보낸 값)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그(예: v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build · sign · notarize · publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          RAW="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then echo "::error::version 을 결정할 수 없습니다 (ref=$GITHUB_REF_NAME)"; exit 1; fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved: MARKETING_VERSION=$VERSION, CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Standalone unit regression
        run: swift Tests/run_unit_tests.swift

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive (Release, Developer ID 매뉴얼 서명)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project PathDock.xcodeproj \
            -scheme PathDock \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath "$RUNNER_TEMP/PathDock.xcarchive" \
            -derivedDataPath ./.build \
            -clonedSourcePackagesDirPath ./.spm \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            CODE_SIGN_ENTITLEMENTS="PathDock/Resources/PathDock-Release.entitlements" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            archive

      - name: Export (developer-id) — Sparkle 중첩 코드 재서명
        id: export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key><string>developer-id</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo '  <key>signingCertificate</key><string>Developer ID Application</string>'
            echo "  <key>teamID</key><string>${APPLE_TEAM_ID}</string>"
            echo '</dict>'
            echo '</plist>'
          } > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PathDock.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          APP="$RUNNER_TEMP/export/PathDock.app"
          [ -d "$APP" ] || { echo "::error::export 된 PathDock.app 없음"; ls -la "$RUNNER_TEMP/export" || true; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "=== 서명 검증 ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|Runtime" || true

      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="${{ steps.export.outputs.app }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package signed .app → .zip
        id: zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ZIP="PathDock-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.export.outputs.app }}" "$ZIP"
          ls -la "$ZIP"
          echo "name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast.xml (Sparkle)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          TAG: ${{ steps.ver.outputs.raw }}
          ZIP: ${{ steps.zip.outputs.name }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          SIGN_BIN="$(find ./.spm -path '*/bin/sign_update' -type f | head -1)"
          [ -x "$SIGN_BIN" ] || { echo "::error::sign_update 도구를 찾지 못했습니다"; exit 1; }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          SIG_ATTRS="$("$SIGN_BIN" "$ZIP" --ed-key-file "$RUNNER_TEMP/sparkle_ed_key")"
          rm -f "$RUNNER_TEMP/sparkle_ed_key"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          PUBDATE="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">'
            echo '  <channel>'
            echo '    <title>PathDock</title>'
            echo '    <item>'
            echo "      <title>${VERSION}</title>"
            echo "      <pubDate>${PUBDATE}</pubDate>"
            echo "      <sparkle:version>${BUILD}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            echo '      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>'
            echo "      <enclosure url=\"${DL}\" ${SIG_ATTRS} type=\"application/octet-stream\" />"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml
          echo "=== appcast.xml ==="; cat appcast.xml

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.raw }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 없음 → 생성"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 존재 → 자산 갱신"
            gh release upload "$TAG" "$ZIP" appcast.xml --clobber
          else
            gh release create "$TAG" "$ZIP" appcast.xml \
              --title "$TAG" \
              --generate-notes
          fi
